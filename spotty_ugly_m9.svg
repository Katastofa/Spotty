<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 900" width="1240" height="900" font-family="DejaVu Sans, Arial, sans-serif">
<defs>
  <marker id="ae" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#d92b2b"/></marker>
  <marker id="ag" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#777"/></marker>
</defs>
<rect width="1240" height="900" fill="#ffffff"/>

<text x="24" y="30" font-size="21" font-weight="bold" fill="#111">M9 — какие углы мерить</text>
<text x="24" y="50" font-size="13" fill="#444">Подать суставу его JOINT_ZERO_US и замерить, под каким углом он на самом деле встал. Двенадцать раз.</text>

<!-- ===== P1 ЭТАЛОН ===== -->
<rect x="24" y="64" width="396" height="406" rx="6" fill="none" stroke="#ccc"/>
<text x="44" y="90" font-size="14" font-weight="bold" fill="#111">1 · ЭТАЛОН — нулевая поза</text>
<text x="44" y="108" font-size="12" fill="#666">так должно быть, если нули идеальны</text>

<rect x="130" y="128" width="180" height="34" fill="#eee" stroke="#999"/>
<line x1="220" y1="165" x2="220" y2="425" stroke="#bbb" stroke-width="1.2" stroke-dasharray="6 4"/>
<line x1="220" y1="182" x2="220" y2="296" stroke="#999" stroke-width="12" stroke-linecap="round"/>
<line x1="220" y1="296" x2="220" y2="398" stroke="#999" stroke-width="12" stroke-linecap="round"/>
<circle cx="220" cy="182" r="6" fill="#111"/>
<circle cx="220" cy="296" r="6" fill="#111"/>
<circle cx="220" cy="398" r="6" fill="#111"/>
<text x="240" y="178" font-size="12" fill="#111">T — ось бедра</text>
<text x="240" y="292" font-size="12" fill="#111">K — ось колена</text>
<text x="240" y="394" font-size="12" fill="#111">A — ось стопы</text>
<text x="200" y="232" font-size="14" font-weight="bold" fill="#1a8f3c" text-anchor="end">0°</text>
<text x="200" y="346" font-size="14" font-weight="bold" fill="#1a8f3c" text-anchor="end">0°</text>
<text x="44" y="452" font-size="11" fill="#666">Робот вывешен, корпус по уровню, ноги не касаются стола.</text>

<!-- ===== P2 БЕДРО ===== -->
<rect x="432" y="64" width="396" height="406" rx="6" fill="none" stroke="#ccc"/>
<text x="452" y="90" font-size="14" font-weight="bold" fill="#111">2 · БЕДРО</text>
<text x="452" y="108" font-size="12" fill="#666">угол к вертикали</text>
<line x1="740" y1="100" x2="790" y2="100" stroke="#777" stroke-width="1.4" marker-end="url(#ag)"/>
<text x="736" y="104" font-size="11" fill="#777" text-anchor="end">вперёд</text>

<line x1="600" y1="180" x2="600" y2="345" stroke="#bbb" stroke-width="1.2" stroke-dasharray="6 4"/>
<text x="592" y="340" font-size="11" fill="#999" text-anchor="end">вертикаль</text>
<line x1="600" y1="180" x2="668" y2="300" stroke="#999" stroke-width="12" stroke-linecap="round"/>
<circle cx="600" cy="180" r="6" fill="#111"/>
<circle cx="668" cy="300" r="6" fill="#111"/>
<text x="586" y="176" font-size="12" fill="#111" text-anchor="end">T</text>
<text x="684" y="298" font-size="12" fill="#111">K</text>
<polyline points="641.9,254 631.8,258.8 621.3,262.3 610.4,264.4 600,265" fill="none" stroke="#d92b2b" stroke-width="2"/>
<text x="660" y="272" font-size="13" font-weight="bold" fill="#d92b2b">θ бедра</text>

<text x="452" y="380" font-size="12.5" fill="#333">Угол между вертикалью и линией «T → K».</text>
<text x="452" y="402" font-size="12.5" font-weight="bold" fill="#333">+ если колено ушло ВПЕРЁД.</text>
<text x="452" y="432" font-size="11" fill="#888">Мерить линию между центрами валов.</text>
<text x="452" y="450" font-size="11" fill="#888">Силуэт детали не годится — у бедра излом 7.33°.</text>

<!-- ===== P3 КОЛЕНО ===== -->
<rect x="840" y="64" width="376" height="406" rx="6" fill="none" stroke="#ccc"/>
<text x="860" y="90" font-size="14" font-weight="bold" fill="#111">3 · КОЛЕНО</text>
<text x="860" y="108" font-size="12" fill="#666">угол к продолжению бедра</text>

<line x1="985" y1="140" x2="1053" y2="260" stroke="#999" stroke-width="12" stroke-linecap="round"/>
<line x1="1053" y1="260" x2="1010" y2="380" stroke="#999" stroke-width="12" stroke-linecap="round"/>
<line x1="1053" y1="260" x2="1101" y2="345" stroke="#bbb" stroke-width="1.2" stroke-dasharray="6 4"/>
<text x="1108" y="348" font-size="11" fill="#999">продолжение бедра</text>
<circle cx="985" cy="140" r="6" fill="#111"/>
<circle cx="1053" cy="260" r="6" fill="#111"/>
<circle cx="1010" cy="380" r="6" fill="#111"/>
<text x="971" y="136" font-size="12" fill="#111" text-anchor="end">T</text>
<text x="1069" y="256" font-size="12" fill="#111">K</text>
<text x="1024" y="398" font-size="12" fill="#111">A</text>
<polyline points="1087.5,320.9 1073.5,326.9 1058.5,329.8 1043.3,329.3 1029.4,325.9" fill="none" stroke="#d92b2b" stroke-width="2"/>
<text x="1040" y="308" font-size="13" font-weight="bold" fill="#d92b2b" text-anchor="middle">θ колена</text>

<text x="860" y="412" font-size="12.5" fill="#333">Угол между ПРОДОЛЖЕНИЕМ бедра</text>
<text x="860" y="430" font-size="12.5" fill="#333">и линией «K → A». Прямая нога = 0°.</text>
<text x="860" y="454" font-size="12.5" font-weight="bold" fill="#333">+ = сгибание, стопа идёт к корпусу.</text>

<!-- ===== P4 ХИП ===== -->
<rect x="24" y="486" width="396" height="390" rx="6" fill="none" stroke="#ccc"/>
<text x="44" y="512" font-size="14" font-weight="bold" fill="#111">4 · ХИП — вид спереди</text>
<text x="44" y="530" font-size="12" fill="#666">угол плоскости ноги к вертикали</text>

<rect x="110" y="552" width="220" height="38" fill="#eee" stroke="#999"/>
<text x="120" y="577" font-size="11" fill="#777">корпус</text>
<line x1="345" y1="545" x2="392" y2="545" stroke="#777" stroke-width="1.4" marker-end="url(#ag)"/>
<text x="341" y="549" font-size="11" fill="#777" text-anchor="end">наружу</text>

<circle cx="240" cy="620" r="9" fill="none" stroke="#1f6fb2" stroke-width="2"/>
<line x1="234" y1="614" x2="246" y2="626" stroke="#1f6fb2" stroke-width="2"/>
<line x1="246" y1="614" x2="234" y2="626" stroke="#1f6fb2" stroke-width="2"/>
<text x="222" y="612" font-size="12" fill="#1f6fb2" text-anchor="end">H — ось хипа</text>
<line x1="240" y1="620" x2="240" y2="775" stroke="#bbb" stroke-width="1.2" stroke-dasharray="6 4"/>
<line x1="240" y1="629" x2="290" y2="769" stroke="#999" stroke-width="12" stroke-linecap="round"/>
<polyline points="266.5,695.5 260.7,697.3 253.9,698.8 247.0,699.7 240,700" fill="none" stroke="#d92b2b" stroke-width="2"/>
<text x="300" y="712" font-size="13" font-weight="bold" fill="#d92b2b">θ хипа</text>

<text x="44" y="812" font-size="12.5" fill="#333">Угол между вертикалью и плоскостью ноги.</text>
<text x="44" y="836" font-size="12.5" font-weight="bold" fill="#333">+ = отведение НАРУЖУ от корпуса.</text>
<text x="44" y="858" font-size="11" fill="#888">Для хипа «вперёд/назад» не определено — он крутится вокруг продольной оси.</text>

<!-- ===== P5 ===== -->
<rect x="432" y="486" width="784" height="390" rx="6" fill="none" stroke="#ccc"/>
<text x="452" y="512" font-size="14" font-weight="bold" fill="#111">5 · ЗНАКИ И ПОРЯДОК</text>

<text x="452" y="552" font-size="13" font-weight="bold" fill="#1f6fb2">ХИП</text>
<text x="546" y="552" font-size="12.5" fill="#333">+ = отведение НАРУЖУ от корпуса</text>
<text x="452" y="580" font-size="13" font-weight="bold" fill="#1f6fb2">БЕДРО</text>
<text x="546" y="580" font-size="12.5" fill="#333">+ = вынос ноги ВПЕРЁД</text>
<text x="452" y="608" font-size="13" font-weight="bold" fill="#1f6fb2">КОЛЕНО</text>
<text x="546" y="608" font-size="12.5" fill="#333">+ = СГИБАНИЕ, стопа к корпусу</text>
<text x="452" y="634" font-size="11" fill="#888">Одинаково для всех четырёх ног. Зеркальность бортов — в JOINT_SIGN.</text>

<text x="452" y="686" font-size="13" font-weight="bold" fill="#111">ПОРЯДОК</text>
<text x="452" y="714" font-size="12.5" fill="#333">1. Робот вывешен, ноги не касаются стола.</text>
<text x="452" y="740" font-size="12.5" fill="#333">2. servo_hold: подать ОДНОМУ суставу его нуль.</text>
<text x="452" y="766" font-size="12.5" fill="#333">3. Замерить фактический угол транспортиром.</text>
<text x="452" y="792" font-size="12.5" fill="#333">4. Записать со знаком. Повторить 12 раз.</text>
<text x="452" y="822" font-size="12.5" fill="#333">5. новый_нуль = старый_нуль − SIGN × угол × 5.57</text>

<rect x="850" y="540" width="350" height="180" rx="4" fill="#fffbe6" stroke="#e0cf8a"/>
<text x="868" y="568" font-size="12.5" font-weight="bold" fill="#5a4a10">Почему углы не нулевые</text>
<text x="868" y="594" font-size="12" fill="#5a4a10">Качалка садится на шлиц 25T,</text>
<text x="868" y="616" font-size="12" fill="#5a4a10">шаг зуба 14.4°. Поставить точно</text>
<text x="868" y="638" font-size="12" fill="#5a4a10">было невозможно, поэтому у каждого</text>
<text x="868" y="660" font-size="12" fill="#5a4a10">сустава своя остаточная ошибка.</text>
<text x="868" y="690" font-size="12" font-weight="bold" fill="#5a4a10">Ожидание: в пределах ±7.2°.</text>
<text x="868" y="710" font-size="11" fill="#8a7530">Больше — перепутан знак или линия.</text>

<rect x="850" y="742" width="350" height="112" rx="4" fill="#f4f7fb" stroke="#c3d3e4"/>
<text x="868" y="770" font-size="12.5" font-weight="bold" fill="#1f4a73">Мерить линию между центрами валов</text>
<text x="868" y="794" font-size="12" fill="#1f4a73">Силуэт детали не годится: у бедра</text>
<text x="868" y="816" font-size="12" fill="#1f4a73">излом 7.33°, деталь и её ось — разные</text>
<text x="868" y="838" font-size="12" fill="#1f4a73">линии. Помогает фото строго сбоку.</text>
</svg>
