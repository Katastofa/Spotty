<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 900" width="1240" height="900" font-family="DejaVu Sans, Arial, sans-serif">
<defs>
  <marker id="ae" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#d92b2b"/></marker>
  <marker id="as" markerWidth="9" markerHeight="9" refX="1" refY="4.5" orient="auto"><path d="M9,0 L0,4.5 L9,9 z" fill="#d92b2b"/></marker>
</defs>
<rect width="1240" height="900" fill="#ffffff"/>

<text x="24" y="30" font-size="21" font-weight="bold" fill="#111">SPOTTY — где мерить</text>
<text x="24" y="50" font-size="13" fill="#444">● центр оси вращения (вал серво или гнездо стопы). Мерить между центрами, не по краям деталей. Всё в мм.</text>

<!-- ============ PANEL A ============ -->
<rect x="24" y="64" width="580" height="392" rx="6" fill="none" stroke="#ccc"/>
<text x="44" y="90" font-size="14" font-weight="bold" fill="#111">ВИД СБОКУ — одна нога</text>
<text x="44" y="108" font-size="12" fill="#666">M2, M3a, M3b. Все три оси в этом виде — точки.</text>

<rect x="140" y="120" width="240" height="38" fill="#eee" stroke="#999"/>
<text x="150" y="144" font-size="11" fill="#777">корпус</text>

<line x1="230" y1="172" x2="295" y2="292" stroke="#999" stroke-width="12" stroke-linecap="round"/>
<line x1="295" y1="292" x2="225" y2="409" stroke="#999" stroke-width="12" stroke-linecap="round"/>
<circle cx="225" cy="409" r="26" fill="none" stroke="#999" stroke-width="2" stroke-dasharray="4 3"/>
<line x1="165" y1="437" x2="300" y2="437" stroke="#bbb" stroke-width="3"/>

<circle cx="230" cy="172" r="6" fill="#111"/>
<circle cx="295" cy="292" r="6" fill="#111"/>
<circle cx="225" cy="409" r="6" fill="#111"/>
<text x="244" y="168" font-size="12" fill="#111">T — ось бедра (вал серво бедра)</text>
<text x="309" y="288" font-size="12" fill="#111">K — ось колена</text>
<text x="258" y="405" font-size="12" fill="#111">A — ось гнезда стопы (⌀26)</text>

<line x1="195" y1="191" x2="260" y2="311" stroke="#d92b2b" stroke-width="1.6" marker-start="url(#as)" marker-end="url(#ae)"/>
<text x="188" y="252" font-size="13" font-weight="bold" fill="#d92b2b" text-anchor="end">M2</text>
<text x="188" y="268" font-size="11" fill="#888" text-anchor="end">T ↔ K, ожид. 108.3</text>

<line x1="329" y1="313" x2="259" y2="430" stroke="#d92b2b" stroke-width="1.6" marker-start="url(#as)" marker-end="url(#ae)"/>
<text x="345" y="368" font-size="13" font-weight="bold" fill="#d92b2b">M3a</text>
<text x="345" y="384" font-size="11" fill="#888">K ↔ A, ожид. 116.5</text>

<line x1="225" y1="409" x2="199" y2="409" stroke="#d92b2b" stroke-width="1.6" marker-end="url(#ae)"/>
<text x="150" y="405" font-size="13" font-weight="bold" fill="#d92b2b" text-anchor="end">M3b</text>
<text x="150" y="421" font-size="11" fill="#888" text-anchor="end">R_FOOT, ожид. 19.4</text>

<text x="44" y="452" font-size="11" fill="#666">Не мерить «до кончика стопы» — M3a и M3b снимать независимо.</text>

<!-- ============ PANEL B ============ -->
<rect x="620" y="64" width="596" height="392" rx="6" fill="none" stroke="#ccc"/>
<text x="640" y="90" font-size="14" font-weight="bold" fill="#111">ВИД СПЕРЕДИ — M1</text>
<text x="640" y="108" font-size="12" fill="#666">Ось хипа здесь — точка, ось бедра — горизонтальная линия.</text>

<rect x="760" y="126" width="300" height="40" fill="#eee" stroke="#999"/>
<text x="770" y="151" font-size="11" fill="#777">корпус</text>

<circle cx="900" cy="192" r="9" fill="none" stroke="#1f6fb2" stroke-width="2"/>
<line x1="894" y1="186" x2="906" y2="198" stroke="#1f6fb2" stroke-width="2"/>
<line x1="906" y1="186" x2="894" y2="198" stroke="#1f6fb2" stroke-width="2"/>
<text x="916" y="190" font-size="12" fill="#1f6fb2">H — ось хипа (продольная)</text>

<line x1="820" y1="235" x2="1140" y2="235" stroke="#d92b2b" stroke-width="1.4" stroke-dasharray="7 4"/>
<text x="1000" y="256" font-size="12" fill="#d92b2b">ось бедра — поперечная</text>
<circle cx="960" cy="235" r="6" fill="#111"/>
<line x1="960" y1="235" x2="960" y2="330" stroke="#999" stroke-width="11" stroke-linecap="round"/>
<line x1="960" y1="330" x2="935" y2="400" stroke="#999" stroke-width="11" stroke-linecap="round"/>

<line x1="900" y1="192" x2="782" y2="192" stroke="#bbb" stroke-width="1"/>
<line x1="820" y1="235" x2="782" y2="235" stroke="#bbb" stroke-width="1"/>
<line x1="792" y1="192" x2="792" y2="235" stroke="#d92b2b" stroke-width="1.6" marker-start="url(#as)" marker-end="url(#ae)"/>
<text x="782" y="210" font-size="13" font-weight="bold" fill="#d92b2b" text-anchor="end">M1</text>
<text x="782" y="226" font-size="11" fill="#888" text-anchor="end">ожид. 10.75</text>

<rect x="640" y="300" width="470" height="86" rx="4" fill="#fffbe6" stroke="#e0cf8a"/>
<text x="654" y="322" font-size="12" fill="#5a4a10">Оси хипа и бедра перпендикулярны и скрещиваются.</text>
<text x="654" y="342" font-size="12" fill="#5a4a10">Расстояние «от вала до вала» зависит от места приложения</text>
<text x="654" y="362" font-size="12" fill="#5a4a10">инструмента и смысла не имеет. Мерить ТОЛЬКО вертикальный</text>
<text x="654" y="382" font-size="12" fill="#5a4a10">зазор: высота вала хипа над столом минус высота вала бедра.</text>

<text x="640" y="428" font-size="11" fill="#666">Нога должна стоять в нуле — плоскость ноги вертикальна.</text>

<!-- ============ PANEL C ============ -->
<rect x="24" y="476" width="580" height="400" rx="6" fill="none" stroke="#ccc"/>
<text x="44" y="502" font-size="14" font-weight="bold" fill="#111">ВИД СБОКУ — две ноги одного борта — M4</text>

<rect x="110" y="540" width="380" height="52" fill="#eee" stroke="#999"/>
<line x1="90" y1="606" x2="520" y2="606" stroke="#1f6fb2" stroke-width="1.4" stroke-dasharray="7 4"/>
<text x="96" y="622" font-size="11" fill="#1f6fb2">ось хипа — одна общая прямая, для базы не годится</text>

