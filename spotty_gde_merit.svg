<line x1="450" y1="652" x2="450" y2="845" stroke="#bbb" stroke-width="1"/>
<line x1="160" y1="838" x2="450" y2="838" stroke="#d92b2b" stroke-width="1.6" marker-start="url(#as)" marker-end="url(#ae)"/>
<text x="305" y="830" font-size="13" font-weight="bold" fill="#d92b2b" text-anchor="middle">M4</text>
<text x="305" y="860" font-size="11" fill="#666" text-anchor="middle">между центрами валов серво БЕДРА · ожидание не определено</text>

